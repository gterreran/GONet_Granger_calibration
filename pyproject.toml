[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "grid-calibration"
version = "1.0"
description = "Interactive fisheye grid calibration pipeline for GONet cameras"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Giacomo Terreran"},
]
keywords = [
    "fisheye",
    "calibration",
    "astronomy",
    "dash",
    "plotly",
    "gonet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "dash>=2.18",
    "scikit-image",
    "pywebview",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "sphinx",
    "furo",
]


[project.scripts]
grid-calibration = "grid_calibration.cli:main"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = ["grid_calibration*"]
exclude = [
    "docs*",
    "tests*",
]


[tool.pytest.ini_options]
testpaths = [
    "grid_calibration/tests",
]
markers = [
    "slow: marks slow tests",
    "realdata: marks tests requiring real calibration datasets",
]


[tool.coverage.run]
source = ["grid_calibration"]


[tool.coverage.report]
omit = [
    "*/tests/*",
]
